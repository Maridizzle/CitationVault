name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.2)'
        required: true
        default: 'v1.0.2'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build single-file CitationVault.exe (splash + bundled app)
        working-directory: splash
        run: >
          pyinstaller --onefile --windowed
          --collect-all tkinter
          --add-binary "..\CitationVault.exe;."
          --name CitationVault
          CitationVaultLauncher.py

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: "CitationVault ${{ github.event.inputs.tag }} by Maridizzle"
          body: |
            ## CitationVault ${{ github.event.inputs.tag }}

            Made by **Maridizzle**

            ### Download

            **[CitationVault.exe]** — download and double-click. No install needed.

            The app opens with a Maridizzle splash screen, then launches automatically.
          files: splash/dist/CitationVault.exe
          draft: false
          prerelease: false
